# nginx sirve los archivos estáticos del build y reenvía /api al contenedor api.
# El upgrade WebSocket para /api/live/* se maneja con los headers de abajo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA fallback: cualquier ruta que no sea un archivo cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy HTTP al backend.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Headers necesarios para WebSocket (upgrade handshake)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
