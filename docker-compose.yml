# docker compose up --build
#   db        PostgreSQL con los datos crudos, los entrenamientos y las predicciones
#   trainer   carga el CSV en la base y entrena (corre una vez y termina)
#   api       FastAPI; arranca solo después de que el trainer termine OK
#   frontend  React compilado y servido por nginx; reenvía /api al servicio api
#
# Perfiles opcionales:
#   docker compose --profile tools up adminer      navegador de la BD en :8081
#   docker compose --profile dev run --rm tests    pruebas automatizadas
#   docker compose --profile dev up notebook       JupyterLab en :8888

x-python: &python
  build:
    context: .
    target: runtime
  image: comentaventa-ml
  environment:
    DATABASE_URL: postgresql+psycopg://comentaventa:comentaventa@db:5432/comentaventa
  # El código también está dentro de la imagen; montarlo permite editar
  # params.yaml, src/ o api/ y reentrenar sin reconstruir. Solo hace falta
  # reconstruir cuando cambia requirements.txt.
  volumes:
    - ./artifacts:/app/artifacts
    - ./data:/app/data
    - ./params.yaml:/app/params.yaml:ro
    - ./src:/app/src:ro
    - ./api:/app/api:ro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comentaventa
      POSTGRES_PASSWORD: comentaventa
      POSTGRES_DB: comentaventa
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comentaventa -d comentaventa"]
      interval: 3s
      timeout: 3s
      retries: 20

  trainer:
    <<: *python
    command: ["python", "-m", "src.pipeline", "--skip-if-trained"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *python
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    image: comentaventa-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  adminer:
    image: adminer:5
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db

  tests:
    build:
      context: .
      target: dev
    image: comentaventa-dev
    profiles: [dev]
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
    volumes:
      - ./params.yaml:/app/params.yaml:ro
      - ./src:/app/src:ro
      - ./api:/app/api:ro
      - ./tests:/app/tests:ro

  notebook:
    image: comentaventa-dev
    build:
      context: .
      target: dev
    profiles: [dev]
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser",
              "--allow-root", "--ServerApp.token=", "--notebook-dir=/app"]
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./params.yaml:/app/params.yaml:ro
      - ./src:/app/src:ro

volumes:
  pgdata:
